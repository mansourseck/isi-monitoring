<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion — ISI Monitor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:white;border-radius:20px;padding:48px 40px;width:420px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:32px;font-weight:800;color:#e94560;letter-spacing:2px}
.logo p{color:#888;font-size:13px;margin-top:4px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;color:#555;font-weight:600;margin-bottom:6px}
.form-group input{width:100%;padding:12px 16px;border:2px solid #eee;border-radius:10px;font-size:15px;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:#e94560}
.btn{width:100%;padding:13px;background:#e94560;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{background:#c73652}
.alert{padding:11px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}
.alert-danger{background:#fee2e2;color:#991b1b}
.hint{text-align:center;margin-top:18px;font-size:12px;color:#bbb}
.hint code{background:#f5f5f5;padding:2px 6px;border-radius:4px;color:#e94560}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.role-badge{text-align:center;padding:8px;border-radius:8px;font-size:11px;font-weight:600}
.role-admin{background:#fee2e2;color:#991b1b}
.role-prof{background:#f3e8ff;color:#6b21a8}
.role-etu{background:#dbeafe;color:#1e40af}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <h1>ISI Monitor</h1>
    <p>Systeme de gestion academique — ISI Keur Massar</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="form-group">
      <label>Nom d'utilisateur</label>
      <input type="text" name="username" placeholder="admin" required autofocus>
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">Se connecter</button>
  </form>
  <div class="hint" style="margin-top:16px">Comptes de test :</div>
  <div class="roles">
    <div class="role-badge role-admin">admin<br><code style="font-size:10px">admin123</code></div>
    <div class="role-badge role-prof">prof1<br><code style="font-size:10px">prof123</code></div>
    <div class="role-badge role-etu">etudiant1<br><code style="font-size:10px">etudiant123</code></div>
  </div>
</div>
</body>
</html>
