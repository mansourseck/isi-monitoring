<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion — ISI Fichiers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f3460,#16213e,#1a1a2e);min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:white;border-radius:20px;padding:48px 40px;width:420px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:28px;font-weight:800;color:#0f3460;letter-spacing:1px}
.logo .sub{color:#888;font-size:13px;margin-top:4px}
.logo .badge{display:inline-block;background:#dbeafe;color:#1e40af;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-top:8px;text-transform:uppercase;letter-spacing:1px}
.fg{margin-bottom:18px}
.fg label{display:block;font-size:13px;color:#555;font-weight:600;margin-bottom:6px}
.fg input{width:100%;padding:12px 16px;border:2px solid #eee;border-radius:10px;font-size:15px;outline:none;transition:border-color .2s}
.fg input:focus{border-color:#0f3460}
.btn{width:100%;padding:13px;background:#0f3460;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{background:#16213e}
.alert{padding:11px 14px;border-radius:8px;margin-bottom:16px;font-size:13px;background:#fee2e2;color:#991b1b}
.web-link{text-align:center;margin-top:18px;font-size:12px;color:#aaa}
.web-link a{color:#0f3460;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <h1>ISI Monitor</h1>
    <div class="sub">Portail bulletins et rapports</div>
    <div class="badge">Espace documents</div>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="alert">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="fg"><label>Nom d'utilisateur</label><input type="text" name="username" placeholder="admin / prof1 / etudiant1" required autofocus></div>
    <div class="fg"><label>Mot de passe</label><input type="password" name="password" placeholder="••••••••" required></div>
    <button type="submit" class="btn">Se connecter</button>
  </form>
  <div class="web-link">Acces au portail de gestion : <a href="http://web.isi-monitor.local:8081" target="_blank">web.isi-monitor.local:8081</a></div>
</div>
</body>
</html>
